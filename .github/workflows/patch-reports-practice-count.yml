name: Apply Reports practice count fix

on:
  push:
    branches:
      - fix/reports-practice-count-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Reports practice metrics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/routes/Reports.tsx')
          text = path.read_text(encoding='utf-8')
          old = '''  const generated = events.filter((e) => e.type === "practice-generated").length;
  const completed = events.filter((e) => e.type === "practice-completed").length + practiceSets.filter((p) => p.status === "completed").length;
  const percentage = generated > 0 ? Math.round((completed / generated) * 100) : 0;'''
          new = '''  const generatedEvents = events.filter((e) => e.type === "practice-generated").length;
  const completedEvents = events.filter((e) => e.type === "practice-completed").length;
  const legacyCompletedSets = practiceSets.filter((p) => p.status === "completed").length;

  // New study data records both the completion event and the persisted practice-set status.
  // Treat completion events as the source of truth and use completed sets only for legacy data
  // that predates event tracking, otherwise the same practice is counted twice.
  const completed = completedEvents > 0 ? completedEvents : legacyCompletedSets;
  const generated = Math.max(generatedEvents, completed);
  const percentage = generated > 0 ? Math.min(100, Math.round((completed / generated) * 100)) : 0;'''

          if old not in text:
              raise SystemExit('Expected PracticeStatsCard metrics block was not found; refusing to patch.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- app/src/routes/Reports.tsx; then
            echo "No Reports change to commit"
            exit 0
          fi
          git config user.name "qizen-ci"
          git config user.email "qizen-ci@users.noreply.github.com"
          git add app/src/routes/Reports.tsx
          git commit -m "fix: avoid double counting completed practices"
          git push origin HEAD:${GITHUB_REF_NAME}
